name: Daily AI Briefing Pipeline

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST
  workflow_dispatch:      # Manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Architecture
        uses: actions/checkout@v4

      # Explicitly provision Python 3.13 to prevent runtime version drift
      - name: Initialize Python Runtime Context
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Use the native uv installer action for speed and lockfile sync
      - name: Setup UV Package Infrastructure
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Sync Production Dependencies
        run: |
          uv pip install -r requirements.txt

      - name: Execute Engineering Intelligence Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: "priyanshicshah@gmail.com"
        run: |
          uv run python run_pipeline.py
name: Event-Driven Technical News Drops

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Architecture
        uses: actions/checkout@v4

      - name: Initialize Python Runtime Context
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup UV Package Infrastructure
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Sync Production Dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system psycopg2-binary

      - name: Execute Engineering Intelligence Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: "priyanshicshah@gmail.com"
        run: |
          python run_pipeline.py

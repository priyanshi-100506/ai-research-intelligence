[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "An automated AI news and paper aggregation application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "pandas>=3.0.3",
    "google-genai>=2.10.0",
    "feedparser>=6.0.12",
    "arxiv>=4.0.0",
    "certifi>=2026.6.17",
    "tenacity>=9.1.4",
    "datasette>=0.65.2",
    "starlette<2.0.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_news_aggregator"]
include = ["main.py"]
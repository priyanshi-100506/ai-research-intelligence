<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Intelligence Engine Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">AI</div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">News Aggregator & Curator</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Engine Online
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col gap-4 mb-8 pb-4 border-b border-slate-800">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-2xl font-semibold text-white">Curated Technical Insights</h2>
                    <p class="text-slate-400 text-sm mt-1">Showing real-time processed stream metrics from PostgreSQL container infrastructure.</p>
                </div>
                <div class="mt-4 md:mt-0 flex space-x-3">
                    <button onclick="setMinScore(1, this)" id="btn-all-score" class="px-4 py-2 text-sm font-medium rounded-md bg-indigo-600 text-white shadow-sm hover:bg-indigo-500 score-btn transition">All Feed Streams</button>
                    <button onclick="setMinScore(7, this)" id="btn-high" class="px-4 py-2 text-sm font-medium rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 score-btn transition">High Impact Only (7+)</button>
                </div>
            </div>

            <div class="flex space-x-2 bg-slate-900 p-1 rounded-lg border border-slate-800 self-start">
                <button onclick="setCategory('', this)" id="btn-all" class="px-4 py-2 text-sm font-medium rounded-md bg-indigo-600 text-white shadow-sm category-btn transition">All</button>
                <button onclick="setCategory('Robotics', this)" id="btn-robotics" class="px-4 py-2 text-sm font-medium rounded-md text-slate-400 hover:text-white category-btn transition">Robotics</button>
                <button onclick="setCategory('NLP', this)" id="btn-nlp" class="px-4 py-2 text-sm font-medium rounded-md text-slate-400 hover:text-white category-btn transition">NLP</button>
                <button onclick="setCategory('Vision', this)" id="btn-vision" class="px-4 py-2 text-sm font-medium rounded-md text-slate-400 hover:text-white category-btn transition">Vision</button>
            </div>
        </div>

        <div id="articles-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full text-center py-12 text-slate-500">Loading ingested stream telemetry...</div>
        </div>
    </main>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";

        let currentMinScore = 1;
        let currentCategory = '';

        function setMinScore(minScore, btnEl) {
            currentMinScore = minScore;
            document.querySelectorAll('.score-btn').forEach(btn => {
                btn.className = "px-4 py-2 text-sm font-medium rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 score-btn transition";
            });
            btnEl.className = "px-4 py-2 text-sm font-medium rounded-md bg-indigo-600 text-white shadow-sm score-btn transition";
            fetchArticles();
        }

        function setCategory(category, btnEl) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "px-4 py-2 text-sm font-medium rounded-md text-slate-400 hover:text-white category-btn transition";
            });
            btnEl.className = "px-4 py-2 text-sm font-medium rounded-md bg-indigo-600 text-white shadow-sm category-btn transition";
            fetchArticles();
        }

        async function fetchArticles() {
            const container = document.getElementById('articles-container');
            container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">Syncing stream...</div>';

            try {
                const response = await fetch(`${API_BASE}/articles?min_score=${currentMinScore}&category=${encodeURIComponent(currentCategory)}`);
                const articles = await response.json();

                if (articles.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12 text-slate-500 border border-dashed border-slate-800 rounded-xl">
                            No articles found matching this filter.
                        </div>`;
                    return;
                }

                container.innerHTML = articles.map(art => {
                    // Extract technical stack string items into clean arrays
                    const tags = (art.tech_stack || '')
                        .split(',')
                        .map(t => t.trim())
                        .filter(t => t.length > 0 && t !== 'None');

                    // Determine score-based styling metrics
                    let scoreBadgeColor = "bg-slate-800 text-slate-400 border-slate-700";
                    if (art.impact_score >= 8) scoreBadgeColor = "bg-rose-500/10 text-rose-400 border-rose-500/20";
                    else if (art.impact_score >= 6) scoreBadgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";

                    return `
                        <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-6 hover:border-slate-700 transition duration-200 flex flex-col justify-between shadow-xl">
                            <div>
                                <div class="flex justify-between items-start space-x-4 mb-4">
                                    <span class="text-xs font-mono font-medium tracking-wider text-indigo-400 uppercase bg-indigo-500/5 px-2 py-1 rounded border border-indigo-500/10">${art.source_id}</span>
                                    <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold border ${scoreBadgeColor}">
                                        Impact: ${art.impact_score}/10
                                    </span>
                                </div>
                                <h3 class="text-lg font-bold text-white hover:text-indigo-400 transition">
                                    <a href="${art.url}" target="_blank" class="hover:underline">${art.title}</a>
                                </h3>
                                
                                <div class="mt-4 bg-slate-950/50 rounded-lg p-4 border border-slate-800/50">
                                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">AI Summary Analysis</h4>
                                    <p class="text-sm text-slate-300 leading-relaxed">${art.summary}</p>
                                </div>
                                
                                <p class="text-xs text-slate-400 italic mt-3">
                                    <span class="font-semibold text-slate-300 not-italic">Justification:</span> ${art.justification}
                                </p>
                            </div>

                            <div class="mt-6 pt-4 border-t border-slate-800/60 flex flex-wrap gap-1.5">
                                ${tags.length > 0 ? tags.map(tag => `
                                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">${tag}</span>
                                `).join('') : '<span class="text-xs text-slate-600">No specific technologies tagged.</span>'}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-rose-500 border border-dashed border-rose-950/50 rounded-xl bg-rose-500/5">
                        Failed to sync with API backend container. Ensure the Uvicorn application service is active.
                    </div>`;
            }
        }

        // Initialize dashboard fetch on page load
        fetchArticles();
    </script>
</body>
</html>

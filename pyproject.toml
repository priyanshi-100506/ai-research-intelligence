[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "A production-grade AI industry briefing pipeline"
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "pandas>=2.2.0",
    "pydantic>=2.13.4",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.51",
    "python-dotenv>=1.2.2",
    "google-genai>=2.10.0",
    # Add your other dependencies here as needed
]
requires-python = ">=3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]